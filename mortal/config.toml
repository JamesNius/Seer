[control]
version = 4
online = false
state_file = 'checkpoints/SeerX.pth'
best_state_file = 'checkpoints/best.pth'
tensorboard_dir = 'runs'
device = 'cuda'
enable_cudnn_benchmark = true
enable_amp = true
enable_compile = false
batch_size = 1024
opt_step_every = 1
save_every = 400
test_every = 2000000
submit_every = 400

[test_play]
games = 1000
log_dir = 'test_play_logs'

[review]
enable_oracle = false
enable_value_dist = true
value_dist_file = 'checkpoints/value_dist_calibrated.pth'
# 冻结后 oracle 头随共享 backbone 漂移，推理必须读快照（step 1,065,600）
oracle_state_file = 'checkpoints/oracle_frozen_1065600.pt'
# 编码 rayon 线程池大小（None/省略 = 逻辑核数）；重启服务生效
rayon_threads = 12

# 多模型：协议名 -> checkpoint 路径。前端下拉选 Seer / Seer-X。
# GRP/value_dist/oracle 是独立共享组件，不随主模型变，只多加载 Brain+DQN。
[review.models]
Seer = 'checkpoints/seer.1.0.收敛版.pth'
Seer-X = 'checkpoints/SeerX1.0bug修复版.pth'

[env]
gamma = 1.0
pts = [6, 3, 0, -12]
point_weight = 0.15

[resnet]
conv_channels = 192
num_blocks = 40

[cql]
min_q_weight = 5

[aux]
next_rank_weight = 0.2
# oracle 已冻结（step 1,065,600）：权重置 0，前向跳过、不反传。
# 若需恢复联合训练，改回 >0 并到 train.py 取消 oracle 参数的 requires_grad_(False)。
oracle_weight = 0.0

[freeze_bn]
mortal = false

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 5.0

[optim.scheduler]
peak = 2.04e-5
# 从 SeerX.pth(1,929,600, LR=2.04e-5) 平滑衰减到 max_steps=1,954,000
# 剩余 24,400 步, LR 从 2.04e-5 余弦降到 1e-6 (到 max 自动停, 防跑过头)
final = 1e-6
warm_up_steps = 0
max_steps = 1954000

[dataset]
globs = [
    # 原配: LuckyJ aug(126倍) + 天凤 2024 抽 50% (与 SeerX 训练时一致)
    'E:/Program Files/JetBrains/IdeaProjects/batchmortal/luckyj_aug/*.mjson',
    'E:/天凤训练数据/2024/*.mjson',
]
file_index = 'file_index.pth'
file_batch_size = 15
reserve_ratio = 0.0
num_workers = 1
player_names_files = []
num_epochs = 1
enable_augmentation = false
augmented_first = false
luckyj_oversample = 1
tenhou_sample_ratio = 0.5

[baseline.train]
device = 'cuda'
enable_compile = false
state_file = 'checkpoints/baseline.pth'

[baseline.test]
device = 'cuda'
enable_compile = false
state_file = 'checkpoints/baseline.pth'

[online]
history_window = 50
enable_compile = false

[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = '1v3_logs'

[1v3.challenger]
device = 'cuda'
name = 'mortal'
state_file = 'checkpoints/SeerX1.0bug修复版.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda'
name = 'baseline'
state_file = 'checkpoints/seer.1.0.收敛版.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = ''
tactics = ''

[grp]
state_file = 'grp.pth'

[grp.network]
hidden_size = 64
num_layers = 2

[grp.control]
device = 'cuda'
enable_cudnn_benchmark = false
tensorboard_dir = 'grp_runs'
batch_size = 512
save_every = 2000
val_steps = 400

[grp.dataset]
train_globs = [
    'E:/天凤训练数据/2021/**/*.mjson',
    'E:/天凤训练数据/2022/**/*.mjson',
    'E:/天凤训练数据/2023/**/*.mjson',
]
val_globs = ['E:/天凤训练数据/2024/**/*.mjson']
file_index = 'grp_file_index.pth'
file_batch_size = 10

[grp.optim]
lr = 1e-5
